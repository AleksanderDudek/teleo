<!doctype html>
<html lang="pl" data-font="md">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Teleo – modlitwy i afirmacje</title>
    <meta
      name="description"
      content="Wypowiadaj modlitwy i afirmacje na głos. Teleo sprawdza każde zdanie, liczy powtórzenia i wspiera regularność – prywatnie, na Twoim urządzeniu."
    />
    <meta name="theme-color" content="#f7f2e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1713" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Teleo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <style>
      /* Boot splash, replaced by React once the local database is ready. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7f2e7;
        color: #1f4a3a;
        font: 600 1.5rem/1 Georgia, serif;
        letter-spacing: 0.3em;
      }
      .boot span {
        opacity: 0;
        animation: boot-in 0.8s 0.2s ease-out forwards;
      }
      @keyframes boot-in {
        to {
          opacity: 0.85;
        }
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #0f1713;
          color: #d4b36a;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><span>TELEO</span></div></div>
    <noscript>Teleo wymaga JavaScriptu. / Teleo requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
